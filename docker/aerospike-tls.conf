# Aerospike TLS test fixture configuration for mem0-aerospike.
# Mounted over /etc/aerospike/aerospike.conf; the aerospike-server:dev image
# runs `asd --config-file /etc/aerospike/aerospike.conf` directly (no templating).
# The EE feature key ships in the image at /etc/aerospike/features.conf.
# The image is linux/amd64 — it runs under emulation on arm64 hosts.

service {
  feature-key-file /etc/aerospike/features.conf
  cluster-name mem0-tls
  node-id 1
  proto-fd-max 15000
}

logging {
  console {
    context any info
  }
}

# Enables authentication/RBAC — required for PKI certificate auth.
security {
}

network {
  service {
    address any
    port 3000
    tls-address any
    tls-port 4333
    tls-name aerospike-tls
    tls-authenticate-client any
  }

  tls aerospike-tls {
    cert-file /opt/aerospike/certs/server.crt
    key-file /opt/aerospike/certs/server.key
    ca-file /opt/aerospike/certs/ca.crt
  }

  heartbeat {
    mode mesh
    address local
    port 3002
    interval 150
    timeout 10
  }

  fabric {
    address local
    port 3001
  }
}

namespace test {
  replication-factor 1
  default-ttl 0
  nsup-period 1

  storage-engine memory {
    data-size 512M
  }
}
